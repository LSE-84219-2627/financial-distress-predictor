<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zamzam Admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
:root { --navy:#0b1a2e; --teal:#0d3348; --gold:#c8973a; --white:#f4f0e8; --muted:#8ba8b8;
  --common:#3a9e5c; --uncommon:#2e7bbf; --rare:#8842d0; --legendary:#c8973a; }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--navy);color:var(--white);padding:1.5rem}
h1{color:var(--gold);font-size:1.4rem;margin-bottom:1.5rem}
h2{color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;margin:1.5rem 0 .6rem}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;color:var(--muted);padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.08)}
td{padding:.35rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}
tr:hover td{background:rgba(255,255,255,.03)}
.pill{display:inline-block;padding:.1rem .4rem;border-radius:12px;font-size:.72rem;font-weight:600}
.Common{color:var(--common);border:1px solid var(--common)}
.Uncommon{color:var(--uncommon);border:1px solid var(--uncommon)}
.Rare{color:var(--rare);border:1px solid var(--rare)}
.Legendary{color:var(--legendary);border:1px solid var(--legendary)}
.core{background:rgba(200,151,58,.1);color:var(--gold)}
.fun{background:rgba(46,123,191,.1);color:var(--uncommon)}
.stat-row{display:flex;gap:2rem;flex-wrap:wrap;margin-bottom:1rem}
.stat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:.6rem 1rem;font-size:.82rem}
.stat strong{display:block;font-size:1.3rem;color:var(--gold)}
input[type=text]{background:rgba(255,255,255,.06);border:1px solid rgba(200,151,58,.25);color:var(--white);padding:.4rem .7rem;border-radius:6px;font-family:inherit;font-size:.85rem;width:100%;max-width:300px;margin-bottom:1rem}
input[type=text]::placeholder{color:var(--muted)}
input:focus{outline:none;border-color:var(--gold)}
.section{margin-bottom:2.5rem}
</style>
</head>
<body>
<h1>🔧 Zamzam Admin</h1>
<div id="root"></div>
<script type="module">
async function load() {
  const [qRes, sRes] = await Promise.all([
    fetch('./data/questions.json'),
    fetch('./data/schedule.json'),
  ]);
  const { questions } = await qRes.json();
  const schedule = await sRes.json();
  return { questions, schedule };
}

function dateStr(d) { return d.toISOString().slice(0,10); }

function render({ questions, schedule }) {
  const root = document.getElementById('root');
  const qMap = Object.fromEntries(questions.map(q => [q.id, q]));

  // ── Stats ──────────────────────────────────────────────────────────────
  const totalDays = Object.keys(schedule).length;
  const usedIds = new Set(Object.values(schedule).flat());
  const unused = questions.filter(q => !usedIds.has(q.id));
  const coreUnused = unused.filter(q => q.pillar === 'core').length;
  const funUnused = unused.filter(q => q.pillar === 'fun').length;

  let html = `
    <div class="section">
      <h2>Pool stats</h2>
      <div class="stat-row">
        <div class="stat"><strong>${questions.length}</strong>Total questions</div>
        <div class="stat"><strong>${totalDays}</strong>Days scheduled</div>
        <div class="stat"><strong>${usedIds.size}</strong>Questions scheduled</div>
        <div class="stat"><strong>${unused.length}</strong>Never used (core: ${coreUnused}, fun: ${funUnused})</div>
      </div>
      ${unused.length < 30 ? `<p style="color:#e06060">⚠️ Fewer than 30 unused questions remain. Add more soon!</p>` : ''}
    </div>
  `;

  // ── Next 30 days ───────────────────────────────────────────────────────
  html += `<div class="section"><h2>Next 30 days</h2>
    <input type="text" id="search" placeholder="Filter by question…" oninput="filterTable(this.value)">
    <table><thead><tr><th>Date</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>Q5</th></tr></thead>
    <tbody id="sched-body">`;

  const today = new Date(); today.setHours(0,0,0,0);
  for (let i = 0; i < 30; i++) {
    const d = new Date(today); d.setDate(d.getDate() + i);
    const ds = dateStr(d);
    const ids = schedule[ds] || [];
    const isToday = i === 0;
    html += `<tr ${isToday ? 'style="background:rgba(200,151,58,.07)"' : ''}>
      <td>${ds}${isToday ? ' 📅' : ''}</td>`;
    for (const id of ids) {
      const q = qMap[id];
      if (!q) { html += `<td><em style="color:#e06060">?${id}</em></td>`; continue; }
      html += `<td title="${q.prompt}">
        <span class="pill ${q.pillar}">${q.pillar}</span>
        <span style="color:var(--muted);font-size:.78rem"> #${id.slice(1)} ${q.category}</span>
      </td>`;
    }
    html += '</tr>';
  }
  html += '</tbody></table></div>';

  // ── Question list ──────────────────────────────────────────────────────
  html += `<div class="section"><h2>All questions (${questions.length})</h2>
    <table><thead><tr><th>ID</th><th>Pillar</th><th>Difficulty</th><th>Category</th><th>Prompt</th><th>Answers</th></tr></thead><tbody>`;

  for (const q of questions) {
    const tierCounts = { Common: 0, Uncommon: 0, Rare: 0, Legendary: 0 };
    for (const a of q.answers) tierCounts[a.tier]++;
    const tiers = Object.entries(tierCounts).filter(([,n]) => n > 0)
      .map(([t,n]) => `<span class="pill ${t}">${n} ${t}</span>`).join(' ');
    html += `<tr>
      <td style="color:var(--muted)">${q.id}</td>
      <td><span class="pill ${q.pillar}">${q.pillar}</span></td>
      <td style="text-align:center">${q.difficulty}</td>
      <td style="color:var(--muted)">${q.category}</td>
      <td style="max-width:260px">${q.prompt}</td>
      <td>${tiers}</td>
    </tr>`;
  }
  html += '</tbody></table></div>';

  root.innerHTML = html;
}

window.filterTable = function(val) {
  const rows = document.querySelectorAll('#sched-body tr');
  const low = val.toLowerCase();
  rows.forEach(r => {
    r.style.display = r.textContent.toLowerCase().includes(low) ? '' : 'none';
  });
};

load().then(render).catch(e => {
  document.getElementById('root').textContent = 'Error loading data: ' + e.message;
});
</script>
</body>
</html>
